<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APP COURSE- Update & Purchase</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:linear-gradient(135deg,#0d47a1,#1976d2,#42a5f5);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:350px;
    background:white;
    border-radius:20px;
    padding:25px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

.logo{
    font-size:30px;
    font-weight:bold;
    color:#1565c0;
}

.version{
    background:#e3f2fd;
    padding:10px;
    border-radius:10px;
    margin:15px 0;
}

.btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    font-size:16px;
    margin-top:12px;
    cursor:pointer;
    color:white;
}

.update{
    background:#2196f3;
}

.purchase{
    background:#4caf50;
}

.price{
    font-size:24px;
    color:#2e7d32;
    font-weight:bold;
}

</style>
</head>
<body>

<div class="container">

    <div class="logo">APP COURSE</div>

    <div class="version">
        Current Version: 1.0<br>
        New Version: 1.1 Available
    </div>

    <button class="btn update"
        onclick="alert('App Updating...')">
        Update App
    </button>

    <br><br>

    <h3>Monthly VIP Membership</h3>

    <div class="price">
        $15 / Month
    </div>

    <button class="btn purchase"
        onclick="purchaseVIP()">
        Purchase Now
    </button>

</div>

<script>
function purchaseVIP(){
    alert("Redirect to Payment Page");
    // Payment Link
    // window.location.href="payment.html";
}
</script>

</body>
</html>
