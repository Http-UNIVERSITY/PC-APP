
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title> VIP</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Tahoma,Arial,sans-serif;
    background:
    linear-gradient(135deg,#020617,#061b38,#020617);
    color:white;
    min-height:100vh;
}

/* صفحه اصلی */

.container{
    width:100%;
    max-width:450px;
    margin:auto;
    padding:20px 15px 40px;
}

/* لوگو */

.logo{
    text-align:center;
    font-size:36px;
    font-weight:bold;
    margin:20px 0 25px;
    letter-spacing:1px;
}

.logo span{
    color:#00aeff;
}

/* کارت */

.card{
    background:rgba(7,25,50,.95);
    border:1px solid rgba(0,174,255,.35);
    border-radius:22px;
    padding:22px;
    margin-bottom:18px;
    box-shadow:
    0 12px 35px rgba(0,0,0,.55);
}

/* VIP */

.vip-title{
    text-align:center;
    font-size:27px;
    color:#00b7ff;
    font-weight:bold;
}

.crown{
    text-align:center;
    font-size:55px;
    margin-bottom:5px;
}

/* قیمت */

.price{
    text-align:center;
    font-size:48px;
    font-weight:bold;
    margin:12px 0;
}

.price small{
    font-size:14px;
    color:#aeb9c8;
}

/* امکانات */

.features{
    line-height:2.2;
    color:#dcecff;
    font-size:15px;
}

/* دکمه */

button{
    width:100%;
    border:0;
    border-radius:13px;
    padding:15px;
    margin-top:13px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

button:active{
    transform:scale(.97);
}

.pay{
    color:white;
    background:
    linear-gradient(90deg,#007bff,#00c6ff);
}

.login-btn{
    color:white;
    background:#123b64;
}

.logout{
    background:#182638;
    color:#ddd;
}

/* ورودی */

input{
    width:100%;
    padding:15px;
    border-radius:12px;
    border:1px solid #18517d;
    outline:none;
    background:#061528;
    color:white;
    font-size:15px;
    margin-top:10px;
}

input:focus{
    border-color:#00aaff;
}

/* پیام */

.message{
    display:none;
    margin-top:13px;
    padding:12px;
    border-radius:10px;
    text-align:center;
    background:#06172b;
    color:#bdeaff;
    font-size:14px;
}

.success{
    color:#61ffae;
}

.error{
    color:#ff7777;
}

/* VIP content */

.vip-content{
    display:none;
}

.vip-active{
    text-align:center;
    padding:13px;
    border-radius:12px;
    background:#062719;
    color:#5dffad;
}

/* خط */

.line{
    height:1px;
    background:#16405f;
    margin:20px 0;
}

/* footer */

.footer{
    text-align:center;
    color:#718096;
    font-size:12px;
    margin-top:20px;
}

</style>
</head>


<body>

<div class="container">

    <!-- LOGO -->

    <div class="logo">
        AZ <span>GYM</span>
    </div>


    <!-- VIP CARD -->

    <div class="card">

        <div class="crown">
            👑
        </div>

        <div class="vip-title">
            VIP MEMBERSHIP
        </div>

        <div class="price">
            $15
            <small>/ 30 Days</small>
        </div>


        <div class="features">

            ✅ برنامه تمرینی VIP<br>

            ✅ ویدیوهای اختصاصی<br>

            ✅ برنامه غذایی<br>

            ✅ دسترسی به محتوای ویژه<br>

            ✅ عضویت ۳۰ روزه<br>

            🔒 محتوای VIP محافظت‌شده

        </div>


        <!-- PAY -->

        <button
            class="pay"
            onclick="startPayment()">

            💳 PAY $15

        </button>


        <div
            id="paymentMessage"
            class="message">

        </div>

    </div>



    <!-- LOGIN -->

    <div class="card">

        <div class="select.html">
            🔐 VIP LOGIN
        </div>

        <div class="select.html"></div>

        <input
            id="vipPassword"
            type="password"
            placeholder="رمز ورود VIP">

        <button
            class="select.html"
            onclick="loginVIP()">

            🔑 ورود به VIP

        </button>


        <div
            id="loginMessage"
            class="message">

        </div>

    </div>



    <!-- VIP CONTENT -->

    <div
        id="vipContent"
        class="card vip-content">

        <div class="vip-title">
            👑 VIP ACTIVE
        </div>

        <br>

        <div class="vip-active">

            دسترسی VIP شما فعال است ✅

        </div>


        <button
            class="pay"
            onclick="openVideos()">

            🎥 ویدیوهای VIP

        </button>


        <button
            class="login-btn"
            onclick="openWorkout()">

            🏋️ برنامه تمرینی VIP

        </button>


        <button
            class="login-btn"
            onclick="openDiet()">

            🥗 برنامه غذایی VIP

        </button>


        <button
            class="logout"
            onclick="logoutVIP()">

            خروج

        </button>

    </div>



    <!-- OWNER -->

    <div class="card">

        <div class="vip-title">
            ⚙️ OWNER PANEL
        </div>

        <div class="line"></div>

        <input
            id="ownerPassword"
            type="password"
            placeholder="رمز صاحب سایت">

        <button
            class="login-btn"
            onclick="ownerLogin()">

            🔐 ورود مدیر

        </button>


        <div
            id="ownerPanel"
            class="message">

        </div>

    </div>


    <div class="footer">

        © 2026 AZ GYM<br>
        Secure VIP Membership

    </div>

</div>



<script>

/*
==================================================
AZ GYM VIP SYSTEM
==================================================

این قسمت DEMO است.

برای امنیت واقعی:
رمز نباید در JavaScript ذخیره شود.
پرداخت و دسترسی VIP باید توسط سرور بررسی شود.

==================================================
*/


/* رمز آزمایشی */

const VIP_PASSWORD = "VIP15";

const OWNER_PASSWORD = "OWNER15";


/* وضعیت VIP */

let vipActive = false;



/* ================================================
   PAYMENT
================================================ */

function startPayment(){

    const message =
        document.getElementById("paymentMessage");


    message.style.display = "block";

    message.className = "message";

    message.innerHTML =
        "💳 در حال آماده‌سازی پرداخت $15 ...";


    /*
    ===============================================
    پرداخت واقعی باید اینجا وصل شود.

    مثال:

    fetch("/api/create-payment",{
        method:"POST"
    })

    سپس سرور لینک پرداخت را برمی‌گرداند.
    ===============================================
    */


    setTimeout(function(){

        message.innerHTML =
        "⚠️ درگاه پرداخت هنوز به سرور وصل نشده است.";

    },1200);

}



/* ================================================
   VIP LOGIN
================================================ */

function loginVIP(){

    const password =
        document.getElementById("vipPassword").value;


    const message =
        document.getElementById("loginMessage");


    message.style.display = "block";


    if(password === VIP_PASSWORD){

        vipActive = true;


        document
        .getElementById("vipContent")
        .style.display = "block";


        message.className =
            "message success";


        message.innerHTML =
            "ورود موفق بود ✅";


    }else{


        message.className =
            "message error";


        message.innerHTML =
            "رمز ورود اشتباه است ❌";

    }

}



/* ================================================
   OPEN VIDEOS
================================================ */

function openVideos(){

    if(!vipActive){

        alert("ابتدا وارد VIP شوید.");

        return;

    }


    /*
    صفحه ویدیوهای VIP

    نام فایل:
    select.html
    */

    window.location.href =
        "select.html";

}



/* ================================================
   WORKOUT
================================================ */

function openWorkout(){

    if(!vipActive){

        alert("دسترسی VIP فعال نیست.");

        return;

    }


    window.location.href =
        "select.html";

}



/* ================================================
   DIET
================================================ */

function openDiet(){

    if(!vipActive){

        alert("دسترسی VIP فعال نیست.");

        return;

    }


    window.location.href =
        "select.html";

}



/* ================================================
   LOGOUT
================================================ */

function logoutVIP(){

    vipActive = false;


    document
    .getElementById("vipContent")
    .style.display = "none";


    document
    .getElementById("vipPassword")
    .value = "";


    document
    .getElementById("loginMessage")
    .style.display = "none";

}



/* ================================================
   OWNER LOGIN
================================================ */

function ownerLogin(){

    const password =
        document.getElementById("ownerPassword").value;


    const panel =
        document.getElementById("ownerPanel");


    panel.style.display = "block";


    if(password === OWNER_PASSWORD){

        panel.className =
            "message success";


        panel.innerHTML =
        "🔓 پنل مدیر باز شد<br><br>" +

        "💰 قیمت VIP: $15<br>" +

        "📅 مدت عضویت: 30 روز<br>" +

        "👑 وضعیت سیستم: فعال";


    }else{


        panel.className =
            "message error";


        panel.innerHTML =
            "رمز مدیر اشتباه است ❌";

    }

}

</script>

</body>
</html>
