<!DOCTYPE html>
<html>
<head>
<style>
body{
background:#111;
font-family:Arial;
}
.box{
width:90%;
margin:20px auto;
background:#1e1e1e;
border-radius:15px;
overflow:hidden;
}
.header{
background:#333;
color:white;
padding:12px;
}
button{
background:#008cff;
color:white;
border:0;
padding:8px 15px;
border-radius:5px;
cursor:pointer;
}
pre{
color:#9cdcfe;
padding:20px;
font-size:16px;
}
.preview{
background:#0499c7;
width:500px;
margin:30px auto;
padding:20px;
border-radius:10px;
}
.card{
background:white;
padding:20px;
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px;
}
.card button{
background:#eee;
color:#008;
height:70px;
}
</style>
</head>
<body>
<div class="box">
<div class="header">
Dashboard.java
<button onclick="copyCode()">
📋
 Copy</button>
</div>
<pre id="code">
public class Dashboard extends JFrame{
JButton home;
JButton student;
JButton teacher;
JButton setting;
JButton classes;
JButton update;
}
</pre>
</div>
<h2 style="color:white;text-align:center">
Preview
</h2>
<div class="preview">
<h2 style="color:white">
KeepToo Management
</h2>
<div class="card">
<button>
🏠
 Home</button>
<button>
👥
 Students</button>
<button>
👨
 Teacher</button>
<button>
⚙
 Setting</button>
<button>
☰
 Classes</button>
<button>
⬇
 Update</button>
</div>
</div>
<script>
function copyCode(){
let code=document.getElementById("code").innerText;
navigator.clipboard.writeText(code);
alert("Java Code Copied");
}
</script>
</body>
</html>
