<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APP COURSE</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#050b18,#0b2d55,#06111f);
    color:white;
    min-height:100vh;
}

header{
    padding:20px;
    text-align:center;
    background:rgba(0,0,0,.35);
    border-bottom:1px solid rgba(255,255,255,.1);
}

header h1{
    color:#42a5f5;
    font-size:28px;
}

header p{
    color:#b9c8d8;
    margin-top:6px;
}

.container{
    width:94%;
    max-width:1000px;
    margin:25px auto;
}

.card{
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.12);
    border-radius:20px;
    padding:20px;
    margin-bottom:22px;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
}

.title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.title h2{
    font-size:20px;
}

.badge{
    background:#1976d2;
    padding:7px 12px;
    border-radius:20px;
    font-size:12px;
}

/* VIDEO */
video{
    width:100%;
    max-height:500px;
    border-radius:15px;
    background:#000;
}

/* IMAGE */
.photo{
    width:100%;
    max-height:500px;
    object-fit:cover;
    border-radius:15px;
    display:block;
}

/* CODE */
.code-box{
    position:relative;
    background:#050505;
    border-radius:15px;
    overflow:hidden;
    border:1px solid #263238;
}

.code-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 15px;
    background:#101820;
    color:#90caf9;
}

.copy{
    background:#1976d2;
    border:none;
    color:white;
    padding:8px 14px;
    border-radius:8px;
    cursor:pointer;
}

.copy:hover{
    background:#42a5f5;
}

pre{
    padding:18px;
    overflow:auto;
    color:#d7e3ee;
    line-height:1.6;
    font-size:14px;
}

/* BUTTON */
.btn{
    width:100%;
    border:none;
    padding:14px;
    margin-top:15px;
    border-radius:12px;
    background:#1976d2;
    color:white;
    font-size:16px;
    cursor:pointer;
}

.btn:hover{
    background:#42a5f5;
}

footer{
    text-align:center;
    color:#78909c;
    padding:25px;
    font-size:13px;
}
</style>
</head>

<body>

<header>
    <h1>APP COURSE</h1>
    <p>Video • Photo • Code</p>
</header>

<div class="container">

    <!-- VIDEO -->
    <div class="card">
        <div class="title">
            <h2>🎬 Training Video</h2>
            <span class="badge">VIDEO</span>
        </div>

        <video controls poster="photo.jpg">
            <source src="video.mp4" type="video/mp4">
            Your browser does not support video.
        </video>

        <button class="btn" onclick="downloadVideo()">
            ⬇ Download Video
        </button>
    </div>


    <!-- PHOTO -->
    <div class="card">
        <div class="title">
            <h2>🖼 Training Photo</h2>
            <span class="badge">PHOTO</span>
        </div>

        <img src="photo.jpg" class="photo" alt="Training Photo">

        <button class="btn" onclick="downloadPhoto()">
            ⬇ Download Photo
        </button>
    </div>


    <!-- CODE -->
    <div class="card">
        <div class="title">
            <h2>💻 Source Code</h2>
            <span class="badge">CODE</span>
        </div>

        <div class="code-box">

            <div class="code-header">
                <span>HTML</span>
                <button class="copy" onclick="copyCode()">
                    Copy
                </button>
            </div>

            <pre id="code">&lt;div class="welcome"&gt;
    &lt;h1&gt;Welcome to APP COURSE&lt;/h1&gt;
    &lt;p&gt;Start your workout today!&lt;/p&gt;
&lt;/div&gt;</pre>

        </div>

        <button class="btn" onclick="showCode()">
            👁 Display Code
        </button>

    </div>

</div>

<footer>
    © 2026 APP COURSE • All Rights Reserved
</footer>


<script>

function copyCode(){

    let code = document.getElementById("code").innerText;

    navigator.clipboard.writeText(code);

    alert("Code copied successfully!");
}

function showCode(){

    alert(
        document.getElementById("code").innerText
    );
}

function downloadVideo(){

    const link = document.createElement("a");
    link.href = "video.mp4";
    link.download = "AZ-GYM-Video.mp4";
    link.click();

}

function downloadPhoto(){

    const link = document.createElement("a");
    link.href = "photo.jpg";
    link.download = "AZ-GYM-Photo.jpg";
    link.click();

}

</script>

</body>
</html>
