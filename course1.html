<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>COMPUTER APP</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Tahoma,sans-serif;
    color:white;
    min-height:100vh;

    background:
    linear-gradient(rgba(0,0,0,.72),rgba(0,8,25,.88)),
    url("background.jpg");

    background-size:cover;
    background-position:center;
    background-attachment:fixed;
}

.container{
    width:94%;
    max-width:1000px;
    margin:auto;
}

/* HEADER */

header{
    text-align:center;
    padding:30px 10px 20px;
}

.logo{
    font-size:42px;
    font-weight:bold;
}

.logo span{
    color:#00aaff;
}

.subtitle{
    margin-top:8px;
    color:#b9dfff;
}

/* VIDEO */

.video-box{
    margin:25px 0;
    padding:15px;

    background:rgba(3,20,42,.88);

    border:1px solid rgba(0,170,255,.4);

    border-radius:20px;

    box-shadow:
    0 10px 35px rgba(0,0,0,.5);
}

.video-title{
    font-size:22px;
    color:#00b7ff;
    margin-bottom:12px;
}

video{
    width:100%;
    display:block;
    border-radius:14px;
    background:#000;
}

/* CODE */

.code-box{
    margin:30px 0;

    background:#050a12;

    border:1px solid #164a70;

    border-radius:18px;

    overflow:hidden;

    direction:ltr;
    text-align:left;
}

.code-header{
    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:12px 15px;

    background:#0b1c30;

    color:#00b7ff;
}

.code-header button{
    border:0;
    padding:8px 15px;

    border-radius:8px;

    background:#008cff;
    color:white;

    cursor:pointer;
}

pre{
    padding:20px;

    overflow-x:auto;

    color:#d8e8ff;

    font-size:14px;

    line-height:1.7;
}

/* BUTTONS */

.buttons{
    display:flex;
    gap:12px;
    margin:20px 0;
}

.btn{
    flex:1;

    padding:14px;

    border:0;
    border-radius:12px;

    background:linear-gradient(
        90deg,
        #007cff,
        #00bfff
    );

    color:white;

    font-size:16px;
    font-weight:bold;

    cursor:pointer;
}

/* FOOTER */

footer{
    text-align:center;

    padding:35px 10px;

    color:#91a7bd;
}

/* MOBILE */

@media(max-width:600px){

    .logo{
        font-size:34px;
    }

    .video-title{
        font-size:19px;
    }

    pre{
        font-size:12px;
    }

    .buttons{
        flex-direction:column;
    }
}
</style>
</head>


<body>

<div class="container">

<header>

    <div class="logo">
        COMPUTER <span>APP</span>
    </div>

    <div class="subtitle">
        APPLICATIONS • Training • Programming
    </div>

</header>


<!-- VIDEO 1 -->

<div class="video-box">

    <div class="video-title">
        🎥 ویدیو تمرینی شماره ۱
    </div>

    <video controls poster="video1.jpg">

        <source
            src="video1.mp4"
            type="video/mp4">

        مرورگر شما از ویدیو پشتیبانی نمی‌کند.

    </video>

</div>


<!-- CODE -->

<div class="code-box">

    <div class="code-header">

        <span>COMPUTER / APP</span>

        <button onclick="copyCode()">
            Copy
        </button>

    </div>

<pre id="code">
&lt;div class="az-gym"&gt;

    &lt;h1&gt;AZ GYM&lt;/h1&gt;

    &lt;p&gt;
        Welcome to AZ GYM
    &lt;/p&gt;

    &lt;button&gt;
        Start Training
    &lt;/button&gt;

&lt;/div&gt;
</pre>

</div>


<!-- BUTTONS -->

<div class="buttons">

    <button class="btn"
    onclick="showCode()">
        نمایش کد
    </button>

    <button class="btn"
    onclick="alert('AZ GYM Ready!')">
        شروع
    </button>

</div>


<!-- VIDEO 2 -->

<div class="video-box">

    <div class="video-title">
        🎥 ویدیو تمرینی شماره ۲
    </div>

    <video controls poster="video2.jpg">

        <source
            src="video2.mp4"
            type="video/mp4">

        مرورگر شما از ویدیو پشتیبانی نمی‌کند.

    </video>

</div>


<footer>

    © 2026 AZ GYM
    <br>
    Fitness & Training

</footer>

</div>


<script>

function copyCode(){

    const code =
        document.getElementById("code").innerText;

    navigator.clipboard.writeText(code);

    alert("کد کاپی شد ✅");
}


function showCode(){

    document
    .getElementById("code")
    .scrollIntoView({
        behavior:"smooth"
    });

}

</script>

</body>
</html>
